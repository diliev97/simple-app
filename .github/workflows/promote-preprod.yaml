name: Promote to Preprod

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "release/YYYY-MM-DD or hotfix/YYYY-MM-DD"
        required: true

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TARGET_BRANCH: preprod

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prevent older release promotion
        if: steps.detect.outputs.branch_type == 'release'
        run: |
          git fetch origin $TARGET_BRANCH

          LAST_PROMOTION=$(git log origin/$TARGET_BRANCH \
            --grep="Promoted:" \
            -1 \
            --pretty=format:"%s" || true)

          if [ -z "$LAST_PROMOTION" ]; then
            echo "No previous promotion found. Allowing first promotion."
            exit 0
          fi

          echo "Last promotion: $LAST_PROMOTION"

          LAST_DATE=$(echo "$LAST_PROMOTION" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
          NEW_DATE="${{ steps.detect.outputs.version }}"

          if [ -n "$LAST_DATE" ] && [[ "$LAST_DATE" > "$NEW_DATE" ]]; then
            echo "ERROR: A newer release ($LAST_DATE) is already promoted."
            exit 1
          fi

          echo "Promotion order validation passed."
  create-pr:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.create_pr.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Create PR to preprod
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.inputs.source_branch }}"
          BASE="${{ env.TARGET_BRANCH }}"

          echo "Creating PR from '$BRANCH' to '$BASE'"

          PR_URL=$(gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "Promote: $BRANCH to preprod" \
            --body "Promotion to preprod environment" \
            --repo "${{ github.repository }}")

          echo "PR created: $PR_URL"

          PR_NUMBER=$(echo "$PR_URL" | awk -F'/' '{print $NF}')

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
  wait-for-merge:
    needs: create-pr
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Wait until PR is merged
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        PR_NUMBER="${{ needs.create-pr.outputs.pr_number }}"

        echo "PR number is: $PR_NUMBER"

        if [ -z "$PR_NUMBER" ]; then
          echo "PR number is empty!"
          exit 1
        fi

        for i in {1..180}; do
          STATE=$(gh pr view "$PR_NUMBER" --json state -q '.state')
          MERGED_AT=$(gh pr view "$PR_NUMBER" --json mergedAt -q '.mergedAt')

          echo "State: $STATE | mergedAt: $MERGED_AT"

          if [[ "$STATE" == "MERGED" ]]; then
            echo "PR merged successfully."
            exit 0
          fi

          if [[ "$STATE" == "CLOSED" ]]; then
            echo "PR closed without merge."
            exit 1
          fi

          sleep 20
        done

        echo "Timeout waiting for PR merge."
        exit 1
  promote:
    name: Promote Image to Preprod
    needs: [validate, wait-for-merge]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: needs.validate.outputs.branch_type == 'hotfix'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag release image
        if: startsWith(github.event.inputs.source_branch, 'release/')        
        run: |
          VERSION="${{ github.event.inputs.source_branch }}"
          VERSION="${VERSION#release/}"
          echo "Retagging release image for $VERSION"

          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION-release
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION-release \
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION-preprod
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION-preprod

          echo "Promotion complete (retag only)."

      - name: Build and push hotfix image
        if: needs.validate.outputs.branch_type == 'hotfix'   
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          BRANCH="${{ github.event.inputs.source_branch }}"

          echo "Building new preprod image for hotfix $VERSION"

          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION-preprod \
            .

          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION-preprod

          echo "Promotion complete (new image built)."