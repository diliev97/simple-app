name: Rollback to Release

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target release date (e.g., 2026-05-21)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: preprod
          fetch-branch: true

      - name: Configure git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Find and revert merge commit
        id: revert
        run: |
          TARGET_DATE=${{ github.event.inputs.target_date }}
          echo "Looking for target date: $TARGET_DATE"

          # Find the merge commit by searching for the pattern in commit messages
          FOUND_COMMIT=$(git log --oneline --all --format=%H --grep="$TARGET_DATE" | head -1)

          if [ -z "$FOUND_COMMIT" ]; then
            # Try a different approach - look for commits with the date in message body
            FOUND_COMMIT=$(git log --oneline -30 --format=%H | while read commit; do
              MSG=$(git log -1 --format=%B "$commit")
              if echo "$MSG" | grep -qiE "release/$TARGET_DATE|hotfix/$TARGET_DATE"; then
                echo "$commit"
                break
              fi
            done)
          fi

          if [ -z "$FOUND_COMMIT" ]; then
            echo "Could not find merge commit for release/hotfix $TARGET_DATE"
            echo "All merge commits in last 20:"
            git log --oneline -20 --merges
            exit 1
          fi

          echo "Found merge commit: $FOUND_COMMIT"
          MSG=$(git log -1 --format=%B $FOUND_COMMIT)
          echo "Commit message: $MSG"
          echo "commit=$FOUND_COMMIT" >> $GITHUB_OUTPUT

          # Revert the merge commit (creates a new commit that undoes the merge)
          git revert -m 1 $FOUND_COMMIT --no-commit
          git commit -m "Revert: Rollback to release $TARGET_DATE"

      - name: Push reverted changes
        run: |
          git push origin preprod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and retag image for rollback
        run: |
          TARGET_DATE=${{ github.event.inputs.target_date }}
          NEW_TIMESTAMP=$(date +%Y-%m-%d)

          # Pull the existing preprod image for the target date
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TARGET_DATE-preprod

          # Tag with new timestamp
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TARGET_DATE-preprod \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$NEW_TIMESTAMP-preprod

          # Push the retagged image
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$NEW_TIMESTAMP-preprod

          echo "Rolled back to $TARGET_DATE, new image: $NEW_TIMESTAMP-preprod"

      - name: Create rollback PR
        if: failure()
        run: |
          # If push failed (e.g., branch protection), create a PR instead
          git push origin preprod:rollback/${{ github.event.inputs.target_date }}
          echo "Created branch for manual PR"