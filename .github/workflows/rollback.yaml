name: Rollback to Release

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target release date (e.g., 14.05.2026)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: preprod
          fetch-branch: true

      - name: Configure git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Find and revert merge commit
        id: revert
        run: |
          TARGET_DATE=${{ github.event.inputs.target_date }}

          # Find the merge commit that merged the target release/hotfix
          # Look for commits like "Merge branch 'release/14.05.2026' into preprod"
          MERGE_COMMITS=$(git log --oneline --merges -20 origin/preprod)

          FOUND_COMMIT=""
          for commit in $MERGE_COMMITS; do
            MSG=$(git log -1 --format=%B $commit)
            if echo "$MSG" | grep -qE "Merge (branch|commit).*(release|hotfix)/$TARGET_DATE"; then
              FOUND_COMMIT=$commit
              break
            fi
          done

          if [ -z "$FOUND_COMMIT" ]; then
            echo "Could not find merge commit for release/hotfix $TARGET_DATE"
            echo "Available merge commits:"
            echo "$MERGE_COMMITS"
            exit 1
          fi

          echo "Found merge commit: $FOUND_COMMIT"
          echo "commit=$FOUND_COMMIT" >> $GITHUB_OUTPUT

          # Revert the merge commit (creates a new commit that undoes the merge)
          git revert -m 1 $FOUND_COMMIT --no-commit
          git commit -m "Revert: Rollback to release $TARGET_DATE"

      - name: Push reverted changes
        run: |
          git push origin preprod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and retag image for rollback
        run: |
          TARGET_DATE=${{ github.event.inputs.target_date }}
          NEW_TIMESTAMP=$(date +%d.%m.%Y)

          # Pull the existing preprod image for the target date
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TARGET_DATE-preprod

          # Tag with new timestamp
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TARGET_DATE-preprod \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$NEW_TIMESTAMP-preprod

          # Push the retagged image
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$NEW_TIMESTAMP-preprod

          echo "Rolled back to $TARGET_DATE, new image: $NEW_TIMESTAMP-preprod"

      - name: Create rollback PR
        if: failure()
        run: |
          # If push failed (e.g., branch protection), create a PR instead
          git push origin preprod:rollback/${{ github.event.inputs.target_date }}
          echo "Created branch for manual PR"