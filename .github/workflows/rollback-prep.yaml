name: Rollback Preprod

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release to rollback to (YYYY-MM-DD)"
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: diliev97/simple-app

jobs:

  rollback:
    name: Rollback via Image Re-Push Only
    runs-on: ubuntu-latest

    steps:
      - name: Validate input
        run: |
          VERSION="${{ github.event.inputs.release_version }}"

          echo "Requested rollback version: $VERSION"

          if ! echo "$VERSION" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Invalid version format. Expected YYYY-MM-DD"
            exit 1
          fi

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY \
            -u ${{ github.actor }} \
            --password-stdin

      - name: Verify image exists
        run: |
          VERSION="${{ github.event.inputs.release_version }}"
          TAG="$VERSION-preprod"

          echo "Checking image exists: $TAG"

          docker manifest inspect $REGISTRY/$IMAGE_NAME:$TAG > /dev/null || {
            echo "Image $TAG does not exist in registry"
            exit 1
          }

          echo "Image exists: $TAG"

      - name: Rollback (re-push existing image)
        run: |
          VERSION="${{ github.event.inputs.release_version }}"
          TAG="$VERSION-preprod"

          echo "Rolling back using image: $TAG"

          # Pull existing image
          docker pull $REGISTRY/$IMAGE_NAME:$TAG

          # Re-push same image (this updates timestamp in registry)
          docker push $REGISTRY/$IMAGE_NAME:$TAG

          echo "Rollback completed successfully"
          echo "Argo CD will now detect updated image"