name: Promote to Preprod

on:
  push:
    branches:
      - preprod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote-to-preprod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect merged branch type and date
        id: detect
        run: |
          # Get the merge commit and find which release/hotfix branch was merged
          COMMITS=$(git log --oneline --merges -10 origin/preprod)

          for commit in $COMMITS; do
            MSG=$(git log -1 --format=%B $commit)
            if echo "$MSG" | grep -q "Merge branch 'release/"; then
              BRANCH=$(echo "$MSG" | grep -oP "release/\K[0-9.]+" | head -1)
              if [ -n "$BRANCH" ]; then
                echo "date=$BRANCH" >> $GITHUB_OUTPUT
                echo "type=release" >> $GITHUB_OUTPUT
                echo "Detected: release branch with date $BRANCH"
                exit 0
              fi
            fi
            if echo "$MSG" | grep -q "Merge branch 'hotfix/"; then
              BRANCH=$(echo "$MSG" | grep -oP "hotfix/\K[0-9.]+" | head -1)
              if [ -n "$BRANCH" ]; then
                echo "date=$BRANCH" >> $GITHUB_OUTPUT
                echo "type=hotfix" >> $GITHUB_OUTPUT
                echo "Detected: hotfix branch with date $BRANCH"
                exit 0
              fi
            fi
          done

          echo "Could not find merged release/hotfix branch"
          exit 1

      - name: Set up Docker Buildx
        if: steps.detect.outputs.type == 'hotfix'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag release image for preprod
        if: steps.detect.outputs.type == 'release'
        run: |
          DATE=${{ steps.detect.outputs.date }}

          # Pull the release image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$DATE-release

          # Tag with preprod suffix
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$DATE-release \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$DATE-preprod

          # Push the preprod tagged image
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$DATE-preprod

          echo "Retagged release image: $DATE-preprod"

      - name: Build and push new image for hotfix
        if: steps.detect.outputs.type == 'hotfix'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.detect.outputs.date }}-preprod
          build-args: |
            GIT_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          no-cache: true