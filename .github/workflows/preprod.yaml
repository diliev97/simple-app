name: Promote to Preprod

on:
  push:
    branches:
      - preprod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote-to-preprod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect merged branch type and date
        id: detect
        run: |
          echo "=== Detecting merged branch ==="

          # Check if latest commit is a merge (2+ parents)
          PARENT_COUNT=$(git rev-list --parents -n 1 HEAD | wc -l)
          echo "Parent count: $PARENT_COUNT"

          # Get commit messages to check
          if [ "$PARENT_COUNT" -ge 2 ]; then
            MSG=$(git log -1 --format=%B HEAD)
            echo "Merge commit message: $MSG"
          else
            MSG=$(git log -1 --format=%s HEAD)
            echo "Commit message (not merge): $MSG"
          fi

          # Try multiple patterns for release branch (YYYY-MM-DD format)
          # Pattern 1: "Merge branch 'release/2026-05-21' into preprod"
          if echo "$MSG" | grep -qiE "release/[0-9]{4}-[0-9]{2}-[0-9]{2}"; then
            BRANCH=$(echo "$MSG" | grep -oEi "release/[0-9]{4}-[0-9]{2}-[0-9]{2}" | head -1 | cut -d'/' -f2)
            if [ -n "$BRANCH" ]; then
              echo "date=$BRANCH" >> $GITHUB_OUTPUT
              echo "type=release" >> $GITHUB_OUTPUT
              echo "Detected: release branch with date $BRANCH"
              exit 0
            fi
          fi

          # Pattern 2: "Merge pull request #XX from user/release/2026-05-21"
          if echo "$MSG" | grep -qiE "from .*/release/[0-9]"; then
            BRANCH=$(echo "$MSG" | grep -oEi "release/[0-9]{4}-[0-9]{2}-[0-9]{2}" | head -1 | cut -d'/' -f2)
            if [ -n "$BRANCH" ]; then
              echo "date=$BRANCH" >> $GITHUB_OUTPUT
              echo "type=release" >> $GITHUB_OUTPUT
              echo "Detected: release branch (PR) with date $BRANCH"
              exit 0
            fi
          fi

          # Try patterns for hotfix branch
          if echo "$MSG" | grep -qiE "hotfix/[0-9]{4}-[0-9]{2}-[0-9]{2}"; then
            BRANCH=$(echo "$MSG" | grep -oEi "hotfix/[0-9]{4}-[0-9]{2}-[0-9]{2}" | head -1 | cut -d'/' -f2)
            if [ -n "$BRANCH" ]; then
              echo "date=$BRANCH" >> $GITHUB_OUTPUT
              echo "type=hotfix" >> $GITHUB_OUTPUT
              echo "Detected: hotfix branch with date $BRANCH"
              exit 0
            fi
          fi

          # Check recent commit messages (last 5)
          echo "Checking recent commits..."
          for i in 1 2 3 4 5; do
            COMMIT_MSG=$(git log --oneline -$i --format=%s HEAD | head -1)
            echo "Commit $i: $COMMIT_MSG"

            if echo "$COMMIT_MSG" | grep -qiE "release/[0-9]{4}-[0-9]{2}-[0-9]{2}"; then
              BRANCH=$(echo "$COMMIT_MSG" | grep -oEi "release/[0-9]{4}-[0-9]{2}-[0-9]{2}" | head -1 | cut -d'/' -f2)
              if [ -n "$BRANCH" ]; then
                echo "date=$BRANCH" >> $GITHUB_OUTPUT
                echo "type=release" >> $GITHUB_OUTPUT
                echo "Detected from recent: release branch with date $BRANCH"
                exit 0
              fi
            fi

            if echo "$COMMIT_MSG" | grep -qiE "hotfix/[0-9]{4}-[0-9]{2}-[0-9]{2}"; then
              BRANCH=$(echo "$COMMIT_MSG" | grep -oEi "hotfix/[0-9]{4}-[0-9]{2}-[0-9]{2}" | head -1 | cut -d'/' -f2)
              if [ -n "$BRANCH" ]; then
                echo "date=$BRANCH" >> $GITHUB_OUTPUT
                echo "type=hotfix" >> $GITHUB_OUTPUT
                echo "Detected from recent: hotfix branch with date $BRANCH"
                exit 0
              fi
            fi
          done

          echo "Could not find merged release/hotfix branch"
          echo "Last 10 commits:"
          git log --oneline -10
          exit 1

      - name: Set up Docker Buildx
        if: steps.detect.outputs.type == 'hotfix'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag release image for preprod
        if: steps.detect.outputs.type == 'release'
        run: |
          DATE=${{ steps.detect.outputs.date }}
          echo "Retagging release image for date: $DATE"

          # Pull the release image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$DATE-release

          # Tag with preprod suffix
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$DATE-release \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$DATE-preprod

          # Push the preprod tagged image
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$DATE-preprod

          echo "Retagged release image: $DATE-preprod"

      - name: Build and push new image for hotfix
        if: steps.detect.outputs.type == 'hotfix'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.detect.outputs.date }}-preprod
          build-args: |
            GIT_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          no-cache: true