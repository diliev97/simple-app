name: Promote to Preprod

on:
  push:
    branches:
      - preprod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote-to-preprod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect merged branch type and date
        id: detect
        run: |
          # First, check if the latest commit is a merge commit
          IS_MERGE=$(git rev-list --parents -n 1 HEAD | wc -l)
          echo "Number of parents: $IS_MERGE"

          if [ "$IS_MERGE" -ge 2 ]; then
            # This is a merge commit, check the commit message
            MSG=$(git log -1 --format=%B HEAD)
            echo "Commit message: $MSG"
          else
            # Not a merge commit, check recent commits
            MSG=$(git log --oneline -5 | head -1)
            echo "Latest commit: $MSG"
          fi

          # Look for release branch
          if echo "$MSG" | grep -qE "Merge.*release/[0-9]"; then
            BRANCH=$(echo "$MSG" | grep -oE "release/[0-9.]+" | head -1 | cut -d'/' -f2)
            if [ -n "$BRANCH" ]; then
              echo "date=$BRANCH" >> $GITHUB_OUTPUT
              echo "type=release" >> $GITHUB_OUTPUT
              echo "Detected: release branch with date $BRANCH"
              exit 0
            fi
          fi

          # Look for hotfix branch
          if echo "$MSG" | grep -qE "Merge.*hotfix/[0-9]"; then
            BRANCH=$(echo "$MSG" | grep -oE "hotfix/[0-9.]+" | head -1 | cut -d'/' -f2)
            if [ -n "$BRANCH" ]; then
              echo "date=$BRANCH" >> $GITHUB_OUTPUT
              echo "type=hotfix" >> $GITHUB_OUTPUT
              echo "Detected: hotfix branch with date $BRANCH"
              exit 0
            fi
          fi

          # Fallback: check parent commits for release/hotfix references
          echo "Checking parent commits..."
          PARENT1=$(git rev-list --parents -n 1 HEAD | awk '{print $2}')
          if [ -n "$PARENT1" ]; then
            PARENT_MSG=$(git log -1 --format=%B $PARENT1)
            echo "Parent commit message: $PARENT_MSG"

            if echo "$PARENT_MSG" | grep -qE "release/[0-9]"; then
              BRANCH=$(echo "$PARENT_MSG" | grep -oE "release/[0-9.]+" | head -1 | cut -d'/' -f2)
              if [ -n "$BRANCH" ]; then
                echo "date=$BRANCH" >> $GITHUB_OUTPUT
                echo "type=release" >> $GITHUB_OUTPUT
                echo "Detected from parent: release branch with date $BRANCH"
                exit 0
              fi
            fi
          fi

          echo "Could not find merged release/hotfix branch"
          exit 1

      - name: Set up Docker Buildx
        if: steps.detect.outputs.type == 'hotfix'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag release image for preprod
        if: steps.detect.outputs.type == 'release'
        run: |
          DATE=${{ steps.detect.outputs.date }}

          # Pull the release image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$DATE-release

          # Tag with preprod suffix
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$DATE-release \
                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$DATE-preprod

          # Push the preprod tagged image
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$DATE-preprod

          echo "Retagged release image: $DATE-preprod"

      - name: Build and push new image for hotfix
        if: steps.detect.outputs.type == 'hotfix'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.detect.outputs.date }}-preprod
          build-args: |
            GIT_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          no-cache: true