name: Build and Push (release)

on:
  push:
    branches:
      - 'release/*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract date from branch name
        id: extract-date
        run: |
          # Extract date from branch name (e.g., release/14.05.2026 -> 14.05.2026)
          BRANCH_NAME=${{ github.ref_name }}
          DATE=${BRANCH_NAME##release/}
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "Extracted date: $DATE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract-date.outputs.date }}-release
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract-date.outputs.date }}
          build-args: |
            GIT_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          no-cache: true